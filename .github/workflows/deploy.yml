name: Deploy to Firebase

on:
  push:
    branches:
      - claude/optimistic-bardeen-o4gf7w

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build-and-deploy:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting and Database Rules
        run: npx firebase-tools deploy --only hosting:admin,database --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Deploy Storage Rules
        # окремим кроком і continue-on-error: якщо на проєкті ще не увімкнено
        # Firebase Storage (Console → Build → Storage → Get Started), ця
        # команда впаде — і НЕ повинна валити критичний деплой hosting/database.
        continue-on-error: true
        run: npx firebase-tools deploy --only storage --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Install functions dependencies
        # Firebase CLI аналізує functions/index.js ЛОКАЛЬНО (щоб знайти
        # exports) ще до аплоаду в Cloud Build — для цього йому треба
        # firebase-functions/firebase-admin у functions/node_modules. Корене-
        # вий "npm ci" вище ставить залежності лише адмінки, не functions/ —
        # без цього кроку "Deploy Cloud Functions" падав з "Couldn't find
        # firebase-functions package", і жодна зміна в Cloud Functions
        # ніколи не виїжджала (continue-on-error нижче це мовчки ховав).
        run: cd functions && npm ci

      - name: Deploy Cloud Functions (пуші, записи, слоти, чат)
        # Усі функції, КРІМ платіжних. Раніше один спільний крок "--only functions"
        # мав continue-on-error: поки LIQPAY_*/MONOBANK_TOKEN не задані в Secret
        # Manager, firebase-tools відхиляв ВЕСЬ деплой функцій цілком (в CI без
        # підтвердження) — тож жодна зміна пушів/слотів не виїжджала, а CI лишався
        # зеленим. Тепер основні функції деплояться окремо і БЕЗ continue-on-error:
        # якщо вони не виїхали — CI червоніє, а не мовчить.
        env:
          GCLOUD_PROJECT: drivepad-86fe1
          FIREBASE_CONFIG: '{"projectId":"drivepad-86fe1","databaseURL":"https://drivepad-86fe1-default-rtdb.europe-west1.firebasedatabase.app"}'
        run: |
          CORE=$(cd functions && node -e "console.log(Object.keys(require('./index.js')).filter(n=>!/^(createLiqPayOrder|liqpayCallback|createMonobankInvoice|monobankCallback)\$/.test(n)).map(n=>'functions:'+n).join(','))")
          echo "Deploying: $CORE"
          npx firebase-tools deploy --only "$CORE" --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Deploy Landing (публічний сайт)
        # Окремо і з continue-on-error: лендинг (папка landing/, сайт drivepad-86fe1.web.app)
        # не повинен валити критичний деплой адмінки. Іде ПІСЛЯ функцій, бо форма
        # зв'язку (/api/contact) перенаправляється на функцію submitContact.
        continue-on-error: true
        run: npx firebase-tools deploy --only hosting:landing --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Deploy Cloud Functions (платежі)
        # continue-on-error: поки LIQPAY_PUBLIC_KEY/LIQPAY_PRIVATE_KEY/MONOBANK_TOKEN
        # не задані в Secret Manager проєкту (Google Cloud Console → Security →
        # Secret Manager, або `firebase functions:secrets:set <NAME>`), цей крок
        # падатиме — і НЕ повинен валити критичний деплой hosting/database/пушів.
        continue-on-error: true
        run: npx firebase-tools deploy --only functions:createLiqPayOrder,functions:liqpayCallback,functions:createMonobankInvoice,functions:monobankCallback --token "${{ secrets.FIREBASE_TOKEN }}"
