name: Deploy to Firebase

# Деплой Juno — лише вручну (Actions → Deploy to Firebase → Run workflow), після зелених тестів.
# Потрібні: secret FIREBASE_TOKEN (firebase login:ci) і repository variable FIREBASE_PROJECT_ID (id проєкту Juno).
on:
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build-and-deploy:
    needs: tests
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check project id
        run: test -n "$FIREBASE_PROJECT_ID" || { echo "Set repository variable FIREBASE_PROJECT_ID"; exit 1; }

      - name: Install dependencies
        run: |
          npm ci
          (cd functions && npm ci)

      - name: Build admin
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_CLIENT_URL: ${{ vars.VITE_CLIENT_URL }}

      - name: Deploy database rules, admin hosting and functions
        run: npx firebase-tools deploy --project "$FIREBASE_PROJECT_ID" --only hosting:admin,database,functions --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Deploy storage rules
        # окремо: якщо Firebase Storage ще не увімкнено в Console, це не має валити основний деплой
        continue-on-error: true
        run: npx firebase-tools deploy --project "$FIREBASE_PROJECT_ID" --only storage --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Deploy landing
        continue-on-error: true
        run: npx firebase-tools deploy --project "$FIREBASE_PROJECT_ID" --only hosting:landing --token "${{ secrets.FIREBASE_TOKEN }}"
