name: Deploy to Firebase

on:
  push:
    branches:
      - claude/optimistic-bardeen-o4gf7w

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting and Database Rules
        run: npx firebase-tools deploy --only hosting:admin,database --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Deploy Storage Rules
        # окремим кроком і continue-on-error: якщо на проєкті ще не увімкнено
        # Firebase Storage (Console → Build → Storage → Get Started), ця
        # команда впаде — і НЕ повинна валити критичний деплой hosting/database.
        continue-on-error: true
        run: npx firebase-tools deploy --only storage --token "${{ secrets.FIREBASE_TOKEN }}"
