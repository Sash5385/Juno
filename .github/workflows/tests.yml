name: Tests

# Автотести: правила бази, функції салону, моніторинг помилок (на емуляторі Realtime Database)
# і смоук-тест адмінки в демо-режимі. Викликається з deploy.yml — деплой не йде, поки тести червоні.
on:
  workflow_call:
  pull_request:
  push:
    branches:
      - '**'

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-13

      - name: Install dependencies
        run: |
          (cd functions && npm ci)
          (cd tests/rules && npm install --no-audit --no-fund)

      - name: Database rules
        run: npx --yes firebase-tools@13 emulators:exec --only database --project demo-rt "node tests/rules/salons.test.mjs && node tests/rules/salonApp.test.mjs && node tests/rules/salonClientApp.test.mjs && node tests/rules/salonPaths.test.mjs && node tests/unit/salonLogic.test.mjs"

      - name: Subscription billing (tariffs, Monobank webhook, master limit)
        run: npx --yes firebase-tools@13 emulators:exec --only database --project demo-billing "node functions/test/billing.e2e.js"

      - name: Outreach, account deletion, backups
        run: npx --yes firebase-tools@13 emulators:exec --only database --project demo-outreach "node functions/test/outreach.e2e.js"

      - name: Error monitoring
        run: npx --yes firebase-tools@13 emulators:exec --only database --project demo-mon "node functions/test/monitoring.e2e.js"

      - name: Salon functions (bookings, payments, refunds)
        run: npx --yes firebase-tools@13 emulators:exec --only database --project demo-salon "node functions/test/salon.e2e.js"

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Install Playwright
        run: |
          cd tests/smoke
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Smoke test (demo mode, 320px)
        run: |
          nohup npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173 > /dev/null && break; sleep 1; done
          node tests/smoke/smoke.mjs http://localhost:4173
          node tests/smoke/salon-flows.mjs http://localhost:4173
